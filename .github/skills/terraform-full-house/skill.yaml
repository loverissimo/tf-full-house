name: deloitte-terraform-full-house
description: Generate Terraform infrastructure using Deloitte Azure modules

inputs:
  - name: infrastructure
    description: Azure resources to deploy
    required: true

steps:
  - name: Identify resources
    instruction: |
      Determine which Azure resources the user wants.

  - name: Find modules
    instruction: |
      Map resources to Terraform modules from the Deloitte Azure repository.

  - name: Generate project
    instruction: |
      Create a Terraform project with:
      main.tf
      variables.tf
      terraform.tfvars
      providers.tf
      backend.tf
      resources folder

  - name: Generate code
    instruction: |
      Add module blocks in main.tf and resource files in resources folder.